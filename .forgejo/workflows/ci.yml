name: Telegram Bot CI

on: 
  push:
    branches:
      - poc/maestros-csv

jobs:
  build:
      runs-on: docker

      steps:
        - name: Checkout
          uses: actions/checkout@v6

        - name: Node version
          run: npm --version

        - name: Install dependencies
          run: npm ci

        - name: Build
          run: npm run build

  deploy:
    if: ${{ forgejo.event_name == 'push'}}
    needs: build
    runs-on: docker

    steps:
      - name: Configure SSH keys
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            sudo /usr/local/sbin/telegram-bot-deploy