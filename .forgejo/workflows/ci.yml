name: Telegram Bot CI

on: 
  push:
    branches:
      - poc/maestros-csv

jobs:
  build:
      runs-on: docker

      steps:
        - name: Checkout
          uses: actions/checkout@v6

        - name: Node version
          run: npm --version

        - name: Install dependencies
          run: npm ci

        - name: Build
          run: npm run build
